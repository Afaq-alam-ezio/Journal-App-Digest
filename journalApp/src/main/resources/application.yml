# ============================================================
# LOGGING CONFIGURATION
# ============================================================
# Controls how much detail gets printed to the console/log file,
# either globally (root) or per-package/per-class.
#
# Available levels, from MOST detailed to LEAST detailed:
#   TRACE  -> everything, extremely verbose (method entry/exit, fine internals)
#   DEBUG  -> detailed info useful for debugging (variable values, flow steps)
#   INFO   -> general informational messages (app started, user created, etc.)
#   WARN   -> something unexpected happened, but app can continue
#   ERROR  -> something failed / broke
#   OFF    -> disables logging entirely for that logger (nothing printed)
#   ALL    -> opposite of OFF, enables absolutely everything (rarely used directly)
#
# NOTE: setting a level shows THAT level AND everything BELOW it in severity.
# e.g. INFO shows INFO + WARN + ERROR, but NOT DEBUG/TRACE (those are more verbose, and get hidden).
# TRACE shows literally everything, since it's the most verbose level.
#
# More specific (package/class-level) settings OVERRIDE the root setting
# for that specific package/class -- everything else falls back to root.
# ============================================================

#logging:
#  level:
    # ROOT -- applies to EVERY class/package in the app, unless overridden below.
    # Currently set to TRACE = maximum verbosity, shows everything from every class.
    # Good for deep debugging, but very noisy -- usually too much for daily use.
#    root: TRACE

    # ------------------------------------------------------------
    # PER-CLASS OVERRIDE EXAMPLE (currently commented out / disabled)
    # ------------------------------------------------------------
    # Full package path must match the class's actual "package ...;" line exactly,
    # or this override silently does nothing (no error, just gets ignored).
    #
    # net.engineeringdigest.journalApp.Controllers.UserController: DEBUG
    #   -> would show DEBUG and above (DEBUG, INFO, WARN, ERROR) for ONLY this class,
    #      regardless of what root is set to.
    #
    # net.engineeringdigest.journalApp.Controllers.UserController: OFF
    #   -> would COMPLETELY SILENCE this class's logs (including logger.error(...) calls),
    #      even though root is TRACE and everything else stays fully verbose.
    #      Useful for muting one noisy/irrelevant class without affecting the rest of the app.
