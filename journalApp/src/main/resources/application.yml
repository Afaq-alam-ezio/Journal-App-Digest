spring:
  redis:
    url: ${REDIS_URL}
  data:
    mongodb:
      uri: ${MONGO_URI}
      auto-index-creation: true
  profiles:
    active: dev
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080
  servlet:
    context-path: /journal

weather:
  apiKey: ${WEATHER_API_KEY}
  url: https://api.openweathermap.org/data/2.5/weather?q=cityName&appid=APIKEY

elevenLabs:
  apiKey: ${ELEVENLABS_API_KEY}
  voiceId: 1lYr3YU5Zl0sGzL84t1N









